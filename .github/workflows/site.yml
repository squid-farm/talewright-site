name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Picks up docs changes in squid-farm/talewright without any setup in that repository.
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the docs from squid-farm/talewright
        uses: actions/checkout@v4
        with:
          repository: squid-farm/talewright
          ref: main
          path: .talewright
          sparse-checkout: docs
          persist-credentials: false
      - name: Copy the public docs into the site
        run: python3 scripts/sync_docs.py .talewright docs --commit "$(git -C .talewright rev-parse HEAD)"
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check pages, links and anchors
        run: python3 scripts/check_site.py _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
